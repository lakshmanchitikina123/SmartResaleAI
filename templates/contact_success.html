<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Request Sent | SmartResale</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family: Arial, sans-serif;

            background: #09090f;

            color: white;

        }


        .success-card {

            width: 90%;

            max-width: 550px;

            text-align: center;

            padding: 45px 35px;

            background: #13131d;

            border: 1px solid #292936;

            border-radius: 24px;

        }


        .success-icon {

            width: 75px;

            height: 75px;

            margin: auto;

            border-radius: 50%;

            background: rgba(32,184,120,0.12);

            color: #20b878;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 32px;

        }


        h1 {

            margin-top: 22px;

            font-size: 27px;

            font-weight: 800;

        }


        p {

            color: #777787;

            font-size: 13px;

            line-height: 1.8;

            margin-top: 12px;

        }


        .item-name {

            color: #9b8cff;

            font-weight: 800;

        }


        .buttons {

            display: flex;

            gap: 10px;

            margin-top: 25px;

        }


        .btn-custom {

            flex: 1;

            padding: 13px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 12px;

            font-weight: 800;

        }


        .primary {

            background: #7157ff;

            color: white;

        }


        .secondary {

            background: #191923;

            border: 1px solid #30303e;

            color: #aaaaba;

        }


        @media(max-width:600px) {

            .buttons {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<div class="success-card">


    <div class="success-icon">

        <i class="bi bi-check-lg"></i>

    </div>


    <h1>

        Contact Request Sent!

    </h1>


    <p>

        Your request regarding

        <span class="item-name">

            {{ product.title if product.title else "this item" }}

        </span>

        has been submitted successfully.

    </p>


    <p>

        The seller's private contact information
        remains protected.

    </p>


    <div class="buttons">


        <a
            href="/marketplace"
            class="btn-custom primary">

            <i class="bi bi-shop"></i>

            Back to Marketplace

        </a>


        <a
            href="/"
            class="btn-custom secondary">

            <i class="bi bi-house"></i>

            Home

        </a>


    </div>


</div>


</body>

</html>
